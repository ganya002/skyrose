# Workspace navigation. Hyprland gives the key chords `repeat` but not the scroll chords.

[[bind]]
id          = "ws.next"
keys        = ["SUPER + CTRL + Right", "SUPER + PageDown"]
action      = "workspace.next"
flags       = ["repeat"]
linux       = "SUPER + CTRL + Right | SUPER + Page_Down"
description = "next workspace (Page Down is fn+↓ on a MacBook)"

[[bind]]
id          = "ws.next.scroll"
keys        = ["SUPER + mouse_down"]
action      = "workspace.next"
flags       = []
linux       = "SUPER + mouse_down"
description = "next workspace (scroll down)"

[[bind]]
id          = "ws.prev"
keys        = ["SUPER + CTRL + Left", "SUPER + PageUp"]
action      = "workspace.prev"
flags       = ["repeat"]
linux       = "SUPER + CTRL + Left | SUPER + Page_Up"
description = "previous workspace (Page Up is fn+↑ on a MacBook)"

[[bind]]
id          = "ws.prev.scroll"
keys        = ["SUPER + mouse_up"]
action      = "workspace.prev"
flags       = []
linux       = "SUPER + mouse_up"
description = "previous workspace (scroll up)"

[[bind]]
id          = "ws.nextGroup.scroll"
keys        = ["SUPER + CTRL + mouse_down"]
action      = "workspace.nextGroup"
flags       = []
linux       = "SUPER + CTRL + mouse_down"
description = "next workspace group (+10)"

[[bind]]
id          = "ws.prevGroup.scroll"
keys        = ["SUPER + CTRL + mouse_up"]
action      = "workspace.prevGroup"
flags       = []
linux       = "SUPER + CTRL + mouse_up"
description = "previous workspace group (−10)"

[[bind]]
