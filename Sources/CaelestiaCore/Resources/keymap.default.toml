# Caelestia for Mac — default keymap (the single source of truth for every bind).
#
# Copied to ~/.config/caelestia-mac/keymap.toml on first run; the WM, the Settings app, the
# cheat-sheet overlay (SUPER + K), `caelestia keys check` and docs/KEYBINDS.md all read it.
#
# Chords are written with the Linux modifier names, exactly as in Hyprland:
#   SUPER, ALT, CTRL, SHIFT + a key name (Left, Page_Up, Equal, F13, ...), a mouse button
#   (mouse:272 = left, mouse:273 = right), a scroll direction (mouse_up / mouse_down), a media
#   key (VolumeUp, Play, BrightnessDown, ...) or nothing at all ("SUPER") for a modifier tap.
# The [modifiers] table maps the Linux names to physical Mac keys. Preset A (default):
#   SUPER = Left Option (⌥L), ALT = Left Command (⌘L), CTRL = Control, SHIFT = Shift.
# Only the LEFT Option/Command keys are window-manager modifiers; the right ones keep typing
# Norwegian characters (æ ø å @ £ $ { } [ ] | \) and ⌘ app shortcuts as usual.
#
# Keys are bound by physical position (key code), never by character: "Minus" and "Equal"
# are the two keys right of 0, which print "+" and "´" on the Norwegian layout; the cheat
# sheet shows the real characters.
#
# Flags mean the same as in Hyprland:
#   release = fire on key-up      repeat = auto-repeat while held (delay 250 ms, 35/s)
#   locked  = also on the lock screen (media / volume / brightness only, where macOS allows)
#   mouse   = drag bind
#
# `linux` is the original Hyprland chord (binds.json); several are separated by " | ".
# A coverage test fails the build if any of the 153 Hyprland binds is missing here.
#
# window.resize deltas are PERCENT of the window's current size (Caelestia's
# resize_active_window(-10, 0) resizes relatively), not pixels.
#
# The wm.panic bind at the end is fixed: the parser restores it if it is removed or changed.

[modifiers]
super = "lopt"
alt   = "lcmd"
ctrl  = "ctrl"
shift = "shift"

# Trackpad gestures (section 3.5). Off by default: macOS uses 3/4-finger swipes for Spaces and
# Mission Control, so turn those off in System Settings › Trackpad first.
[gestures]
enabled               = false
workspaceSwipeFingers = 4   # horizontal swipe = previous / next workspace
specialFingers        = 3   # swipe up = open special workspace, swipe down = toggle it closed
sleepFingers          = 4   # swipe down = sleep

# ───────────────────────────── Shell ─────────────────────────────

[[bind]]
id          = "launcher.tap"
keys        = ["SUPER"]
action      = "launcher.toggle"
flags       = ["release"]
linux       = "SUPER + SUPER_L"
description = "toggle the launcher (Super tapped alone, nothing else pressed)"

[[bind]]
id          = "launcher.toggle"
keys        = ["SUPER + Space"]
action      = "launcher.toggle"
flags       = []
linux       = "SUPER + Space"
description = "toggle the launcher"

[[bind]]
id          = "session.menu"
keys        = ["CTRL + ALT + Backspace", "CTRL + ALT + Delete"]
action      = "session.toggle"
flags       = []
linux       = "CTRL + ALT + Delete"
description = "session menu (lock, sleep, log out, restart, shut down); Delete is fn+⌫ on a MacBook"

[[bind]]
id          = "sidebar.toggle"
keys        = ["SUPER + N"]
action      = "sidebar.toggle"
flags       = []
linux       = "SUPER + N"
description = "sidebar (notifications and utilities)"

[[bind]]
id          = "notifs.clear"
keys        = ["CTRL + ALT + C"]
action      = "notifs.clear"
flags       = ["locked"]
linux       = "CTRL + ALT + C"
description = "clear all notifications"

[[bind]]
id          = "panels.showAll"
keys        = ["SUPER + K"]
action      = "panels.showAll"
flags       = []
linux       = "SUPER + K"
description = "show all panels (and the keybind cheat sheet)"

[[bind]]
id          = "lock"
keys        = ["SUPER + L"]
action      = "lock"
flags       = []
linux       = "SUPER + L"
description = "lock the screen"

[[bind]]
id          = "shell.restoreLock"
keys        = ["SUPER + ALT + L"]
action      = "shell.restoreLock"
flags       = []
linux       = "SUPER + ALT + L"
description = "restore lock: restart the shell, then lock"

[[bind]]
id          = "shell.kill"
keys        = ["SUPER + CTRL + SHIFT + R"]
action      = "shell.kill"
flags       = ["release"]
linux       = "SUPER + CTRL + SHIFT + R"
description = "kill the shell"

[[bind]]
id          = "shell.restart"
keys        = ["SUPER + CTRL + ALT + R"]
action      = "shell.restart"
flags       = ["release"]
linux       = "SUPER + CTRL + ALT + R"
description = "restart the shell"

