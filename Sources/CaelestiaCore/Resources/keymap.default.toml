# ───────────────────────────── Safety ─────────────────────────────
# Physically ⌃⌥⌘⇧Esc: stops tiling and brings every window back on screen. Fixed: the parser
# puts it back if it is removed, disabled or changed.

[[bind]]
id          = "wm.panic"
keys        = ["CTRL + SUPER + ALT + SHIFT + Escape"]
action      = "wm.panic"
flags       = []
description = "fixed; cannot be removed"
