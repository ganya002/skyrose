keys        = ["SUPER + ALT + mouse_up"]
action      = "workspace.moveToPrev"
flags       = []
linux       = "SUPER + ALT + mouse_up"
description = "move window to the previous workspace (scroll up)"

[[bind]]
id          = "ws.moveToSpecial"
keys        = ["SUPER + ALT + S", "SUPER + CTRL + SHIFT + Up"]
action      = "workspace.moveToSpecial"
args        = { name = "special" }
flags       = []
linux       = "SUPER + ALT + S | SUPER + CTRL + SHIFT + Up"
description = "move window to the special workspace"

[[bind]]
