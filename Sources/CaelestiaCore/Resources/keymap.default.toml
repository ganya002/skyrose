keys        = ["SUPER + ALT + PageUp", "SUPER + CTRL + SHIFT + Left"]
action      = "workspace.moveToPrev"
flags       = ["repeat"]
linux       = "SUPER + ALT + Page_Up | SUPER + CTRL + SHIFT + Left"
description = "move window to the previous workspace"

[[bind]]
