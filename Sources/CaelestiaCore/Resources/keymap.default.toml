flags       = ["repeat"]
linux       = "SUPER + ALT + Page_Down | SUPER + CTRL + SHIFT + Right"
description = "move window to the next workspace"

[[bind]]
id          = "ws.moveToNext.scroll"
keys        = ["SUPER + ALT + mouse_down"]
action      = "workspace.moveToNext"
flags       = []
linux       = "SUPER + ALT + mouse_down"
description = "move window to the next workspace (scroll down)"

[[bind]]
