# ─────────────────────── Window cycling and groups ───────────────────────
# Hyprland cycles with ALT + Tab. On the Mac that is ⌘L+Tab, the app switcher, which is not
# taken over by default (Settings: "Take over ⌘Tab"), so cycling lives on SUPER + Tab.

[[bind]]
id          = "window.cycleNext"
keys        = ["SUPER + Tab"]
action      = "window.cycleNext"
flags       = ["repeat"]
linux       = "ALT + TAB"
description = "cycle to the next window"

[[bind]]
id          = "window.cyclePrev"
keys        = ["SUPER + SHIFT + Tab"]
action      = "window.cyclePrev"
flags       = ["repeat"]
linux       = "ALT + SHIFT + TAB"
description = "cycle to the previous window"

[[bind]]
id          = "group.next"
keys        = ["CTRL + SUPER + Tab"]
action      = "group.next"
flags       = ["repeat"]
linux       = "CTRL + ALT + TAB"
description = "next window in the group (tab)"

[[bind]]
id          = "group.prev"
keys        = ["CTRL + SUPER + SHIFT + Tab"]
action      = "group.prev"
flags       = ["repeat"]
linux       = "CTRL + ALT + SHIFT + TAB"
description = "previous window in the group"

[[bind]]
id          = "group.toggle"
keys        = ["SUPER + Comma"]
action      = "group.toggle"
flags       = []
linux       = "SUPER + Comma"
description = "toggle group (tabbed) for the active window"

[[bind]]
id          = "group.moveOut"
keys        = ["SUPER + U"]
action      = "group.moveOut"
flags       = []
linux       = "SUPER + U"
description = "move window out of its group"

[[bind]]
id          = "group.lock"
keys        = ["SUPER + SHIFT + Comma"]
action      = "group.lock"
flags       = []
linux       = "SUPER + SHIFT + Comma"
description = "lock the active group"

