# ───────────────────────────── Capture ─────────────────────────────
# MacBooks have no Print key; macOS ⇧⌘3/4/5 stay untouched. F13 is Print on external keyboards.
# The spec's ⌥L⇧3 / ⌥L⇧4 would collide with "move window to workspace 3 / 4 silently"
# (SUPER + SHIFT + N), so the screenshots use macOS's own ⇧⌘3 / ⇧⌘4 chords with Super held.

[[bind]]
id          = "capture.region"
keys        = ["SUPER + ALT + SHIFT + 4", "F13"]
action      = "capture.region"
flags       = []
linux       = "Print"
description = "region screenshot (macOS ⇧⌘4 with Super held; SUPER + SHIFT + 4 is taken by ws.moveSilent.4)"

[[bind]]
id          = "capture.full"
keys        = ["SUPER + ALT + SHIFT + 3", "SHIFT + F13"]
action      = "capture.full"
flags       = ["locked"]
linux       = "SHIFT + Print"
description = "full-screen screenshot (macOS ⇧⌘3 with Super held; SUPER + SHIFT + 3 is taken by ws.moveSilent.3)"

[[bind]]
id          = "capture.freeze"
keys        = ["SUPER + SHIFT + S"]
action      = "capture.freeze"
flags       = []
linux       = "SUPER + SHIFT + S"
description = "region screenshot on a frozen screen"

[[bind]]
id          = "record.screen"
keys        = ["CTRL + ALT + R"]
action      = "record.screen"
flags       = []
linux       = "CTRL + ALT + R"
description = "record the screen"

[[bind]]
id          = "record.sound"
keys        = ["SUPER + ALT + R"]
action      = "record.sound"
flags       = []
linux       = "SUPER + ALT + R"
description = "record the screen with sound"

[[bind]]
