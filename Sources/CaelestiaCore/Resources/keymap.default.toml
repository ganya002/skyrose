description = "move (swap) window down"

# Resize: delta is percent of the window's current size. On the Norwegian layout "Minus" is
# the "+" key right of 0 and "Equal" the "´" key next to it (bound by position).

[[bind]]
id          = "window.resize.narrower"
keys        = ["SUPER + Minus", "SUPER + ALT + Left"]
action      = "window.resize"
args        = { axis = "width", delta = -10 }
flags       = ["repeat"]
linux       = "SUPER + Minus | SUPER + ALT + Left"
description = "width −10% of the current size"

[[bind]]
id          = "window.resize.wider"
keys        = ["SUPER + Equal", "SUPER + ALT + Right"]
action      = "window.resize"
args        = { axis = "width", delta = 10 }
flags       = ["repeat"]
linux       = "SUPER + Equal | SUPER + ALT + Right"
description = "width +10% of the current size"

[[bind]]
id          = "window.resize.shorter"
keys        = ["SUPER + SHIFT + Minus", "SUPER + ALT + Up"]
action      = "window.resize"
args        = { axis = "height", delta = -10 }
flags       = ["repeat"]
linux       = "SUPER + SHIFT + Minus | SUPER + ALT + Up"
description = "height −10% of the current size"

[[bind]]
id          = "window.resize.taller"
keys        = ["SUPER + SHIFT + Equal", "SUPER + ALT + Down"]
action      = "window.resize"
args        = { axis = "height", delta = 10 }
flags       = ["repeat"]
linux       = "SUPER + SHIFT + Equal | SUPER + ALT + Down"
description = "height +10% of the current size"

[[bind]]
