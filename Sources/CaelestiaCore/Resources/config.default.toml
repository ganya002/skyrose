# SkyRose - default configuration
#
# This file lists EVERY key with its built-in default (Gabby's effective Arch values:
# hypr/variables.lua + caelestia/hypr-vars.lua + caelestia/hypr-user.lua + shell.json).
# Copy it to ~/.config/skyrose/config.toml and keep only the keys you change: anything
# you leave out falls back to these values. Integers are fine where a float is expected
# (`gapsIn = 5` == `gapsIn = 5.0`). Unknown keys are reported as warnings, out-of-range
# values as errors (the previous good config stays in effect).
#
# Each comment cites the Caelestia variable (variables.lua / hypr-vars.lua) or the Hyprland
# option the key replaces, so Linux knowledge carries over.
#
# Not yet keys (documented here as constants until they are added to Config):
#   volumeStep = 10   (variables.lua volumeStep: % per volume key press)
#   volumeMax  = 100  (variables.lua volumeMax: upper bound in %)

[general]
# "full" = SkyRose WM + the shell (bar, frame, launcher, dashboard, sidebar, OSDs).
# "wm"   = SkyRose WM only: tiling, keybinds and borders; no bar, no shell, no screen frame.
mode = "full"
# Settings › About looks for a newer GitHub release once a day and only tells you.
# Off by default. Installing is always a click (`skyrose update --yes`). Nothing installs itself.
checkForUpdates = false

[shell]
# Every shell part can be turned off on its own. enabled = false turns the whole shell off.
enabled = true
launcher = true
dashboard = true
sidebar = true
session = true
osd = true              # volume / brightness OSD (off: the media keys go back to macOS)
notifications = true    # toasts + notification history
wallpaperPicker = true

# =====================================================================================
# Window manager (Hyprland general / decoration / dwindle / misc)
# =====================================================================================
[wm]
# variables.lua windowGapsIn -> general:gaps_in. 5 on each side = 10 px between neighbours.
gapsIn = 5
# variables.lua windowGapsOut -> general:gaps_out (tiled area to usable-area edge).
gapsOut = 10
# variables.lua singleWindowGapsOut: workspace rules w[tv1]s[false] and f[1]s[false]
# (one tiled window or one fullscreen-flagged window) use this gaps_out instead.
gapsOutSingle = 20
# variables.lua workspaceGaps -> general:gaps_workspaces (gap between workspaces in the slide).
gapsWorkspaces = 20
# variables.lua windowBorderSize -> general:border_size.
bordersEnabled = true   # window borders on/off; borderSize is their width
borderSize = 1
# variables.lua windowRounding -> decoration:rounding.
windowRounding = 15
# variables.lua windowRoundingPower -> decoration:rounding_power.
roundingPower = 2
# rules.lua xwl_popup tag: rounding = math.min(10, windowRounding).
popupRounding = 10
# variables.lua windowOpacity = 0.95 (live getoption, 2026-11-05 capture). Enhanced mode only.
windowOpacity = 0.95
# variables.lua blurEnabled -> decoration:blur:enabled.
blurEnabled = true
# variables.lua blurSize (stock 8; hypr-vars.lua 10 "glass: stronger blur").
blurSize = 10
# variables.lua blurPasses (stock 2; hypr-vars.lua 3).
blurPasses = 3
# variables.lua blurSpecialWs -> decoration:blur:special.
blurSpecial = false
# variables.lua shadowEnabled -> decoration:shadow:enabled.
shadowEnabled = true
# variables.lua shadowRange -> decoration:shadow:range.
shadowRange = 15
# variables.lua shadowRenderPower -> decoration:shadow:render_power (1-4).
shadowRenderPower = 4
# Caelestia shell "border" layer: a thin rounded frame around the usable area.
screenFrame = true
# Points reserved per edge by that frame (hyprctl monitors "reserved").
screenFrameInset = 10
# Hyprland default follow-mouse focus.
focusFollowsMouse = true
focusFollowsMouseDelayMs = 100
# Hover does not raise a floating window above the others (Hyprland follow_mouse = 1).
raiseOnHover = false
# Keyboard focus moves the pointer to that window. Clicks and drags do not.
cursorFollowsFocus = true
# "center" (the middle) or "last" (the last point inside that window).
cursorWarpMode = "center"
# input.lua focus_on_close = 1: focus the window under the cursor after a close.
focusOnCloseUnderCursor = true
# SkyRose: the red close button on an app's last window quits the app (opt-in). A normal quit
# (apps can still ask to save), never a force quit. Only Dock apps; menu-bar apps never quit.
closeQuitsApp = false
# Apps the red button never quits (bundle ids).
closeQuitsAppExceptions = ["com.apple.finder"]
# functions.lua wsaction: workspace id = 10 * (group - 1) + slot.
workspacesPerGroup = 10
workspaceGroups = 5
# Caelestia bar: always show workspaces 1..N.
workspacesShown = 5
# variables.lua specialWsCloseAny: the special toggle closes whichever special workspace is open.
specialWsCloseAny = true
# Standard mode: send interpolated AX frames (<= 60 Hz, <= 200 ms). Off because many apps lag.
animatedTiling = false
# misc.lua on_focus_under_fullscreen = 2: focusing a window un-fullscreens the current one.
unfullscreenOnFocus = true
# misc.lua focus_on_activate = true.
focusOnActivate = true
# Caelestia gameMode IPC toggle: no animations/blur/gaps/borders/shadows.
gameMode = false
# Window manager: "catwm" (CatWM by Per William Krogstad-Østensen, used with permission; the
# default) or "skyrose" (SkyRose's own engine; work in progress, not recommended).
engine = "catwm"

# general.lua dwindle = { preserve_split, smart_split, smart_resizing } + Hyprland defaults.
[wm.dwindle]
preserveSplit = true
smartSplit = false
smartResizing = true
# dwindle:force_split: 0 = the new window goes to the half of the focused tile the cursor is in
# (right/bottom when the cursor is outside it), 1 = always left/top, 2 = always right/bottom.
forceSplit = 0
# dwindle:split_width_multiplier.
splitWidthMultiplier = 1.0
# dwindle:default_split_ratio (0.1 - 1.9).
defaultSplitRatio = 1.0
minSplitRatio = 0.1
maxSplitRatio = 1.9
# Smallest window a split may produce (pt; gaps and border not included). Hyprland has none (it
# went down to 27x32 px). A split that would go below this splits the largest tile that still
# fits instead; if none fits, the new window floats centred. 0 = no minimum.
minTileWidth = 120
minTileHeight = 80

# CatWM-only switches (Settings › CatWM). Gaps, focus and animations come from the rest of the file.
[wm.catwm]
# The layouts the cycle bind steps through; the first is where every workspace starts.
layouts = ["dwindle", "floating"]
dragToSwap = true
dragToResize = true
floatSmallWindows = true
# Bundle IDs that always float; wildcards such as "com.adobe.*" work.
floatingApps = []
# Extra CatWM config lines (TypeScript), added last.
extra = ""
# Window motion: "skyrose" follows [animations]; or ease-out, ease-in-out, linear, spring,
# bounce, overshoot.
motionStyle = "skyrose"
# Seconds a window move takes; 0 follows [animations].
motionSpeed = 0
# How far spring, bounce and overshoot swing, 0-1.
motionBounce = 0.5

# Named special workspaces (scratchpads) and the app that owns each (functions.lua toggle()
# + cli.json toggles). `apps` are bundle ids in preference order; `launch` runs when the
# toggle finds no window on that workspace.
[wm.specialWorkspaces.special]
apps = []
launch = ""

# kbSystemMonitorWs CTRL+SHIFT+Escape -> special:sysmon (btop in a kitty window).
[wm.specialWorkspaces.sysmon]
apps = ["net.kovidgoyal.kitty#btop"]
launch = "kitty --class btop -e btop"

# kbMusicWs SUPER+M -> special:music (Spotify / Music).
[wm.specialWorkspaces.music]
apps = ["com.spotify.client", "com.apple.Music"]
launch = "open -b com.spotify.client || open -b com.apple.Music"

# kbCommunicationWs SUPER+D -> special:communication (Discord / Messages).
[wm.specialWorkspaces.communication]
apps = ["com.hnc.Discord", "com.apple.MobileSMS"]
launch = "open -b com.hnc.Discord || open -b com.apple.MobileSMS"

# kbTodoWs SUPER+R -> special:todo (Todoist / Reminders).
[wm.specialWorkspaces.todo]
apps = ["com.todoist.mac.Todoist", "com.apple.reminders"]
launch = "open -b com.todoist.mac.Todoist || open -b com.apple.reminders"

# =====================================================================================
# Appearance (shell.json appearance.* + theme selection)
# =====================================================================================
[appearance]
# shell.json appearance.transparency.enabled / base / layers.
transparencyEnabled = true
# Panel/bar background alpha.
transparencyBase = 0.75
# Inner card alpha over the panel.
transparencyLayers = 0.35
# Built-in schemes: "skyrose-dynamic", "skyrose-default", "catppuccin-mocha", "noctalia".
theme = "skyrose-dynamic"
# "dark" or "light".
variant = "dark"
# Manual accent override as hex RRGGBB ("" = none).
accentOverride = ""
# Legacy flag, ignored: use schemeMode.
dynamicColor = true
# "static" = the scheme named by `theme` above (periwinkle by default).
# "dynamic" = Material You palette from the current wallpaper, applied live to borders, bar,
# launcher, session menu, dashboard, sidebar, OSD and toasts. Falls back to static when the
# wallpaper cannot be read or is grey. `variant` picks dark/light, `accentOverride` pins the source.
schemeMode = "static"
# Palette style of the wallpaper colours (launcher: >variant): "tonalspot", "vibrant", "expressive",
# "fidelity", "content", "fruitsalad", "rainbow", "neutral" or "monochrome".
paletteStyle = "tonalspot"
uiScale = 1.0
# Caelestia shell fonts (fonts.txt): sans Rubik, mono CaskaydiaCove NF, icons Material Symbols.
fontSans = "Rubik"
fontSansFallbacks = ["Inter", "SF Pro"]
fontMono = "CaskaydiaCove Nerd Font"
fontMonoFallbacks = ["CaskaydiaCove NF", "JetBrainsMono Nerd Font", "JetBrainsMono NF", "Menlo"]
fontIcons = "Material Symbols Rounded"
wallpaperFolder = "~/Pictures/Wallpapers"
# 0 = never rotate wallpapers automatically.
wallpaperRandomIntervalMinutes = 0
# Cursor theme for this login session. Bibata Modern Classic ships with SkyRose (GPL-3.0) and is
# the default. "" is the macOS cursors. Looked up in the app bundle, then
# ~/Library/Application Support/SkyRose/cursors, then Mousecape's capes folder.
# Session-only: nothing on disk changes, and quitting SkyRose or logging out puts the macOS
# cursors back. The spinning wait cursor is never replaced (macOS cannot put it back once changed).
cursor = "Bibata-Modern-Classic"
# The picture between the session menu's buttons: a GIF (animated) or any image on this Mac, as a
# path ("~/" works). Empty draws the moon.
sessionImage = ""

# =====================================================================================
# Dashboard (shell.json dashboard.*)
# =====================================================================================
[dashboard]
showClockSeconds = true
# Battery card in the Performance tab (only on Macs with a battery).
showBattery = true
# "overview", "media", "performance" or "weather".
defaultTab = "overview"
# The cat on the media tab. It listens only while the dashboard is open.
bongoCat = true
# Synced lyrics from LRCLIB (artist, title, album, duration). Cached locally.
lyrics = true

# =====================================================================================
# Clipboard history (Super+V). Stored only on this Mac; passwords are never kept.
# =====================================================================================
[clipboard]
maxEntries = 50
# Copied images, in megabytes. The oldest image goes first.
maxSizeMB = 32

# =====================================================================================
# Weather (dashboard card + Weather tab). Open-Meteo, no API key; pick the city in
# Settings › Bar and Shell. Nothing is fetched and no values are shown until a city is set.
# =====================================================================================
[weather]
city = ""
latitude = 0.0
longitude = 0.0
# Use this Mac's location (asks for the Location permission). Falls back to the city.
useLocation = false
fahrenheit = false
refreshMinutes = 30

# =====================================================================================
# SIP-off mode (docs/ENHANCED_MODE.md). Opt-in: needs SIP partly off and the scripting
# addition loaded into the Dock (`skyrose sa load-command`). Without it nothing changes.
# =====================================================================================
[sipOff]
enabled = false
animations = true          # real-window pop-in / close / move animations
opacity = true             # wm.windowOpacity on non-fullscreen windows
shadows = true             # false removes other apps' window shadows
instantWorkspaces = true   # instant workspace switches, no slide
pinOnTop = true            # pinned windows really stay on top
hideMenuBar = true         # Apple's menu bar is gone, even at the top edge

# =====================================================================================
# Screenshots (skyrose screenshot region|freeze|window|full, Print/F13 binds)
# =====================================================================================
[capture]
folder = "~/Pictures/Screenshots"
saveToFolder = true
copyToClipboard = true
thumbnail = true                 # toast with a thumbnail after each shot
overrideSystemShortcuts = false  # true also binds macOS's ⇧⌘3 / ⇧⌘4 / ⇧⌘5 to SkyRose

# =====================================================================================
# Lid closed (skyrose clamshell on|off). While Clamshell or a keep-awake is on, SkyRose sets
# pmset disablesleep 1 via sudo -n (one-time scoped sudoers rule: skyrose clamshell helper), so
# the Mac keeps running lid-closed on battery and with only the built-in display.
# =====================================================================================
[clamshell]
keepAwake = false          # true: no idle display sleep while running lid-closed

# =====================================================================================
# SkyStore (skyrose store, Settings › SkyStore). See docs/SKYSTORE.md.
# =====================================================================================
[store]
creatorMode = false        # true: skyrose store new|validate|pack|submit, plus the two keys below
indexURL = ""              # "" = the official signed index (HTTPS); file:// only in creator mode
trustedKeys = []           # extra Ed25519 public keys (base64), creator mode only

# =====================================================================================
# Bar (shell.json bar.*)
# =====================================================================================
[bar]
enabled = true
showLogo = true          # bar modules, top to bottom
showWorkspaces = true
showActiveWindow = true
showTray = true
showClock = true
showStatusIcons = true
showPower = true
# A Controls button under the status icons: Control Center toggles and other apps' menu bar items.
controlsButton = true
# Matches shell.json bar.persistent = false: the bar slides in on hover and reserves no width.
# Set true for an always-visible bar that reserves its width in the usable area.
persistent = false
# "left", "right", "top" or "bottom".
edge = "left"
# Measured: the revealed bar is ~60 px wide at scale 1 (2026-11-05 capture).
width = 60
showOnHover = true
# shell.json bar.clock.background.
clockBackground = false
# shell.json bar.tray.background.
trayBackground = false
# shell.json bar.activeWindow.compact.
activeWindowCompact = false
# shell.json bar.workspaces.occupiedBg.
workspacesOccupiedBg = false

# shell.json bar.statusIcons, in display order. A laptop flips "battery" on when the user never set it.
[[bar.statusIcons]]
id = "lockStatus"
enabled = true

[[bar.statusIcons]]
id = "audio"
enabled = true

[[bar.statusIcons]]
id = "microphone"
enabled = false

[[bar.statusIcons]]
id = "kbLayout"
enabled = false

[[bar.statusIcons]]
id = "network"
enabled = true

[[bar.statusIcons]]
id = "bluetooth"
enabled = false

[[bar.statusIcons]]
id = "battery"
enabled = false

# =====================================================================================
# Input (input.lua / gestures.lua / variables.lua touchpad*)
# =====================================================================================
[input]
# kbLauncher "SUPER + SUPER_L": Super pressed and released alone within this window opens the launcher.
superTapMs = 300
# input.lua repeat_delay.
repeatDelayMs = 250
# input.lua repeat_rate.
repeatRatePerSecond = 35
# variables.lua touchpadScrollFactor -> input:touchpad:scroll_factor.
scrollFactor = 0.3
# input.lua touchpad.natural_scroll.
naturalScroll = true
# Continuous-scroll distance per workspace step (points), for the SUPER + mouse_down/up binds.
scrollStepPoints = 60
# Trackpad workspace swipes (gestures.lua). Off by default: macOS owns 3/4-finger swipes.
gesturesEnabled = false
# variables.lua gestureFingers (special workspace up/down swipes).
gestureFingers = 3
# variables.lua gestureFingersMore / workspaceSwipeFingers (horizontal workspace swipe, sleep gesture).
gestureFingersMore = 4
# gestures.lua workspace_swipe_distance.
gestureDistance = 700
# gestures.lua workspace_swipe_cancel_ratio.
gestureCancelRatio = 0.15
# gestures.lua workspace_swipe_min_speed_to_force.
gestureMinSpeedToForce = 5
# gestures.lua workspace_swipe_direction_lock / _threshold.
gestureDirectionLock = true
gestureDirectionLockThreshold = 10
# gestures.lua workspace_swipe_create_new.
gestureCreateNew = true
# "Take over Cmd-Tab" (off: the ALT+TAB window cycle maps to Option(L)+Tab).
takeOverCmdTab = false
# F-row volume / mute / brightness keys are handled by Caelestia: volume via CoreAudio,
# brightness via DisplayServices, only Caelestia's OSD shows and the key never reaches macOS, so
# Apple's HUD stays away. A key Caelestia cannot handle (an output without settable volume, a
# display without brightness control) passes through to macOS (Apple's HUD only). Off: macOS
# handles the keys and Caelestia's OSD shows next to Apple's.
interceptMediaKeys = true

# =====================================================================================
# Apps (variables.lua terminal / browser / editor / fileExplorer / audioSettings)
# =====================================================================================
[apps]
# variables.lua terminal (stock "foot"; hypr-vars.lua "kitty").
terminal = "kitty"
# variables.lua browser "firefox".
browser = "org.mozilla.firefox"
# variables.lua editor "codium".
editor = "com.vscodium"
# variables.lua fileExplorer (stock "thunar"; hypr-vars.lua "nautilus") -> Finder.
fileManager = "com.apple.finder"
# variables.lua audioSettings "pwvucontrol" -> System Settings > Sound.
audioSettings = "x-apple.systempreferences:com.apple.Sound-Settings.extension"
# Font of the SkyRose kitty profile (skyrose.conf, Settings › Terminal): Gabby's kitty.conf.
kittyFont = "JetBrainsMono Nerd Font"
kittyFontSize = 13.0

# =====================================================================================
# Animations (hypr-user.lua "Riko's springy motion" + shell.json appearance.anim)
# =====================================================================================
[animations]
# "gabby-springy" (hypr-user.lua: riko spring, snappy bezier, speed 3.2), "caelestia-stock",
# "reduced" or "off".
preset = "gabby-springy"
# Window animations. "snapshot" (default, Glide) springs a still of each window on a cover.
# "live" moves the real window every refresh: no snapshot, blur, fade or scale.
# "off" snaps to the final frame. Curve and speed: windowsIn / windowsMove / windowsOut below.
windows = "snapshot"
# Keyboard resize and retile. Ease-out (Hyprland's default curve) for this many milliseconds.
# The time does not grow with how far a window moves. 0 snaps. speed / globalMultiplier scale it.
windowDurationMs = 150.0
# Multiplier on every WM duration (1.0 = as configured).
globalMultiplier = 1.0
# Speed of every animation (windows, workspaces, shell): 2.0 = twice as fast, 0.5 = half speed.
speed = 1.0
# shell.json appearance.anim.durations.scale: all shell animations run at 80% duration.
shellDurationScale = 0.8
# Honour the macOS "Reduce motion" accessibility setting.
respectReduceMotion = true
reduceMotion = false    # SkyRose Reduce Motion: every animation becomes a short cross-fade

# Per-animation overrides keyed by Hyprland leaf name (windowsIn, windowsOut, windowsMove,
# workspaces, workspacesIn, workspacesOut, fade, border, ...). Every field is optional.
#
#   [animations.overrides.windowsIn]
#   enabled = true
#   curve = "riko"          # a named curve: riko, snappy, or any Caelestia bezier
#   speed = 3.2             # Hyprland speed (x100 ms)
#   style = "popin 80%"
[animations.overrides]

[frame]
# Radius (pt) of the display's physical rounded corners. The frame's outer edge follows it and
# its inner corners use it - the band thickness, so the band keeps one width around the corner.
# Apple does not publish it: tune it by eye with `skyrose corners calibrate` (or `frame calibrate`).
# A slider or the arrow keys move the live outline (Tab switches top/bottom, 0 makes that pair
# square, Return saves per display under [displays."<uuid>"]).
# A radius larger than the hardware's shows the wallpaper in the corner; a smaller one is hidden.
# displayCornerRadius: top corners (and bottom ones unless set below). Negative = auto: 10 on a
# built-in panel with a notch, 0 (square) elsewhere.
displayCornerRadius = -1
# Bottom corners. Negative = auto: 0 on built-in panels (notched MacBooks round only the top
# corners), else the same as displayCornerRadius.
displayBottomCornerRadius = -1

# =====================================================================================
# Per-display overrides keyed by the stable display id (CGDisplayCreateUUIDFromDisplayID).
# `skyrose query displays` prints the ids. Every field is optional.
#
#   [displays."37D8832A-2D66-02CA-B9F7-8F30A301B230"]
#   gapsIn = 5
#   gapsOut = 10
#   gapsOutSingle = 20
#   barPersistent = true
#   barEnabled = true
#   uiScale = 1.0
#   screenFrame = true
#   displayCornerRadius = 10.5         # written by `skyrose frame calibrate`
#   displayBottomCornerRadius = 0.0    # written by `skyrose frame calibrate`
# =====================================================================================
[displays]

# =====================================================================================
# Per-app window rules, keyed by bundle id: "tile", "float" or "auto".
#   tile  = standard windows tile even if a default/rules.toml would float them (dialogs,
#           sheets, panels and windows too big for the screen still float)
#   float = every window floats, centred at its own size
#   auto  = the built-in defaults, then rules.toml, then the window heuristics
# Built-in floating apps: System Settings, Calculator, Archive Utility, System Information,
# Digital Color Meter, Screen Sharing, Installer, Font Book, ... (`skyrose rules apps`).
# `skyrose rules set <bundle id> <tile|float|auto>` writes this table for you.
#
#   [appRules]
#   "com.apple.finder" = "float"
#   "com.apple.systempreferences" = "tile"
# =====================================================================================
[appRules]
