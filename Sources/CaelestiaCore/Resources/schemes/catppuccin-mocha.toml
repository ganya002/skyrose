# Catppuccin Mocha - the official palette mapped onto the Material 3 roles.
# Sources: catppuccin/palette (Mocha) and the Catppuccin block of kitty/kitty.conf
# (fg cdd6f4, bg 1e1e2e, tabs 11111b/cba6f7/cdd6f4/181825, color0-15).
# Verbatim: base->background/surface, mantle->surfaceContainerLow, crust->surfaceContainerLowest,
# surface0->surfaceContainer, surface1->surfaceContainerHigh, surface2->surfaceContainerHighest,
# text->onSurface, subtext1->onSurfaceVariant, overlay1->outline, overlay0->outlineVariant (kitty
# inactive_border_color), mauve->primary, crust->onPrimary (kitty active_tab_foreground),
# lavender->secondary, pink->tertiary, red->error, green->success, term0-15 = kitty color0-15.
# Derived (not part of the palette): *Dim = role x 0.93, *Container = mix(role, base, 50%),
# on*Container = mix(role, text, 50%), *Fixed = mix(role, text, 30%), inversePrimary = mix(mauve, surface2, 40%).

