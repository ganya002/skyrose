# Noctalia - Gabby's static kitty theme (kitty/themes/noctalia.conf) mapped onto the Material 3 roles.
# Verbatim from noctalia.conf: background/surface 11131a, foreground/onSurface e2e1ec,
# url/active_border/active_tab_background -> primary b6c4ff, active_tab_foreground -> onPrimary 00277f,
# selection_background/inactive_tab_background/inactive_border -> surfaceContainer, surfaceContainerHigh,
# outlineVariant 434654, selection_foreground/inactive_tab_foreground -> onSurfaceVariant c4c5d6,
# color8 -> outline 8e90a0, color1 -> error ffb4ab, color3 -> secondary b7c4fd, color4 -> tertiary fcaaff,
# color0-15 -> term0-15.
# Every other role is derived (surface ladder, *Dim = role x 0.93, containers mixed towards onPrimary,
# standard Material error roles, Caelestia's success roles, hand-picked pastel aliases).

name = "Noctalia"
flavour = "kitty"
mode = "dark"
variant = "static"

