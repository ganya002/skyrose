# XcodeGen project for debugging in Xcode. Not needed to build: scripts/build.sh uses SwiftPM.
#   brew install xcodegen && xcodegen generate --spec Packaging/project.yml --project .
name: SkyRose
options:
  bundleIdPrefix: com.skyrose.mac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SkyRose:
    path: ..
targets:
  SkyRose:
    type: application
    platform: macOS
    info:
      path: SkyRose-Info.plist
    entitlements:
      path: SkyRose.entitlements
    dependencies:
      - package: SkyRose
        product: CaelestiaWMKit
    sources:
      - path: ../Sources/SkyRoseWM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyrose.mac
        CODE_SIGN_IDENTITY: "Caelestia Local Signing"
        ENABLE_HARDENED_RUNTIME: YES
